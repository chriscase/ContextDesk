[workspace]
# Nested workspace so Tauri does not join the repo root Cargo workspace.

[package]
name = "contextdesk"
version = "0.1.3"
description = "ContextDesk desktop host"
authors = ["ContextDesk contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "contextdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol is enabled via the package feature below (tauri build / release).
# Without it, tauri-build sets cfg(dev) and the WebView loads build.devUrl (Vite).
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# log-fastembed: product default local ONNX template embed (#359)
cd-core = { path = "../../crates/cd-core", features = ["log-fastembed", "s3-object-store"] }
cd-workflow = { path = "../../crates/cd-workflow" }
cd-triage-runtime = { path = "../../crates/cd-triage-runtime" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-updater = "2"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
sha2 = "0.10"

[features]
# Production / packaged host: embed frontendDist. Keep off of `default` so
# `tauri dev` still uses the Vite devUrl. Enable with:
#   cargo build --release --features custom-protocol
# or via `tauri build` (CLI enables this feature).
default = []
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
