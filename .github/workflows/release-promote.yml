# Deterministic promote: publish only a complete exact-SHA draft.
# Never runs on tag push. Validation failure leaves the draft unpublished.
name: release-promote

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft tag to validate or publish (e.g. v0.1.0)"
        required: true
        type: string
      expected_git_sha:
        description: "Exact 40-char SHA that must match the draft and assets"
        required: true
        type: string
      confirm_publish:
        description: "Type publish to publish; any other value is validate-only"
        required: true
        type: string
        default: ""

permissions:
  contents: write

jobs:
  promote:
    name: validate-and-maybe-publish
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout expected SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_git_sha }}
          fetch-depth: 0

      - name: Use release-contract Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refuse SHA mismatch
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED: ${{ inputs.expected_git_sha }}
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"
          if [ "$HEAD" != "$EXPECTED" ]; then
            echo "checkout $HEAD != expected $EXPECTED" >&2
            exit 1
          fi
          python3 - <<PY
          import re, sys
          sha = "${{ inputs.expected_git_sha }}"
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              print("expected_git_sha must be the exact 40-char SHA", file=sys.stderr)
              sys.exit(2)
          PY
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          RESOLVED="$(git rev-parse "refs/tags/$TAG^{commit}")"
          if [ "$RESOLVED" != "$EXPECTED" ]; then
            echo "tag $TAG resolves to $RESOLVED, expected $EXPECTED" >&2
            exit 1
          fi

      - name: Verify pinned updater verifier
        run: |
          set -euo pipefail
          test -x /usr/bin/openssl
          /usr/bin/openssl version | grep -E '^OpenSSL 3\.'

      - name: Download draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          gh release download "${{ inputs.tag }}" --dir dist/release
          ls -la dist/release
          test -f dist/release/release-manifest.json
          test -f dist/release/SHA256SUMS

      - name: Validate complete exact-SHA draft
        env:
          CD_GIT_SHA: ${{ inputs.expected_git_sha }}
          CD_CHANNEL: installed
          CONTEXTDESK_RELEASE_OPENSSL: /usr/bin/openssl
        run: |
          set -euo pipefail
          DESCRIBE="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse HEAD)"
          python3 scripts/release-contract/release_contract.py validate-promote \
            --dir dist/release \
            --tag "${{ inputs.tag }}" \
            --expected-git-sha "${{ inputs.expected_git_sha }}" \
            --git-describe "$DESCRIBE" \
            --repo-root . \
            --allow-test-sig false

      - name: Publish only after confirm=publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          CONFIRM: ${{ inputs.confirm_publish }}
          EXPECTED: ${{ inputs.expected_git_sha }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "publish" ]; then
            echo "confirm_publish is not 'publish'; leaving draft unpublished"
            exit 0
          fi
          DESCRIBE="$(git describe --always --dirty --tags 2>/dev/null || git rev-parse HEAD)"
          gh release view "$TAG" \
            --json isDraft,isPrerelease,targetCommitish,tagName,name,body \
            > /tmp/cd-promote-meta.json
          python3 scripts/release-contract/release_contract.py validate-release-state \
            --metadata /tmp/cd-promote-meta.json \
            --tag "$TAG" \
            --expected-git-sha "$EXPECTED" \
            --git-describe "$DESCRIBE" \
            --allow-published true \
            --output-state /tmp/cd-publish-state
          if [ "$(cat /tmp/cd-publish-state)" = "draft" ]; then
            gh release edit "$TAG" --verify-tag --draft=false
          else
            echo "already published exact release; idempotent success"
          fi
          gh release view "$TAG" \
            --json isDraft,isPrerelease,targetCommitish,tagName,name,body \
            > /tmp/cd-published-meta.json
          python3 scripts/release-contract/release_contract.py validate-release-state \
            --metadata /tmp/cd-published-meta.json \
            --tag "$TAG" \
            --expected-git-sha "$EXPECTED" \
            --git-describe "$DESCRIBE" \
            --allow-published true \
            --output-state /tmp/cd-final-publish-state
          test "$(cat /tmp/cd-final-publish-state)" = "published"
          echo "published $TAG at $EXPECTED"
