# Optional Linux release-host GUI integration — not installed-bundle/native proof.
# NOT a required status check. Does not weaken rust/desktop/tauri-host jobs.
name: gui-accept

on:
  workflow_dispatch:
  schedule:
    # Weekly; operators can disable if flaky
    - cron: "0 6 * * 1"

concurrency:
  group: gui-accept-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-host-linux:
    name: release-host WebDriver (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (WebKit driver + Tauri + xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev webkit2gtk-driver \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libssl-dev \
            xvfb

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/gui-accept/package-lock.json

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
        env:
          CARGO_TERM_COLOR: always
          CARGO_BUILD_JOBS: "2"

      - name: GUI accept harness deps + self-test
        working-directory: desktop/gui-accept
        run: |
          npm ci
          npm test

      - name: Exact-head release-host scenario run (xvfb)
        working-directory: desktop/gui-accept
        env:
          GUI_ACCEPT_REQUIRE_RELEASE_HOST: "1"
          GUI_ACCEPT_EXACT_HEAD: "1"
          CARGO_TERM_COLOR: always
          CARGO_BUILD_JOBS: "2"
          # Headless-friendly WebKit; DISPLAY provided by xvfb-run
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          # The orchestrator builds this checkout and records HEAD + executable SHA-256.
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            npm run run

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-accept-linux
          path: desktop/gui-accept/.runs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
