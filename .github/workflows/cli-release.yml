# Artifact-only CLI matrix. Must not create or mutate GitHub Releases.
# Called by `.github/workflows/release.yml` (the single orchestration path).
# Isolated workflow_dispatch still builds archives as Actions artifacts only.
name: cli-release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      git_sha:
        required: true
        type: string
      git_describe:
        required: true
        type: string
      channel:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to check out for an isolated CLI artifact build"
        required: true
        type: string
      git_sha:
        description: "Optional exact SHA; defaults to the checked-out tag"
        required: false
        type: string
      git_describe:
        description: "Optional git describe; defaults to the checked-out tag"
        required: false
        type: string
      channel:
        description: "Embedded channel (official orchestration always uses installed)"
        required: false
        default: "installed"
        type: string

permissions:
  contents: read
  id-token: write  # provenance / attestation when supported

env:
  CARGO_TERM_COLOR: always
  # Required platforms (mutation tests assert this set).
  CLI_RELEASE_PLATFORMS: "macos-arm64,macos-x64,linux-x64,windows-x64"

jobs:
  build-cli:
    name: build-${{ matrix.target.platform }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - platform: macos-arm64
            os: macos-14
            triple: aarch64-apple-darwin
            exe: contextdesk
            archive_ext: tar.gz
          - platform: macos-x64
            os: macos-15-intel
            triple: x86_64-apple-darwin
            exe: contextdesk
            archive_ext: tar.gz
          - platform: linux-x64
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            exe: contextdesk
            archive_ext: tar.gz
          - platform: windows-x64
            os: windows-2022
            triple: x86_64-pc-windows-msvc
            exe: contextdesk.exe
            archive_ext: zip
    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Checkout exact identity
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha || inputs.tag }}
          fetch-depth: 0

      # The CLI uses the shared keychain-backed credential layer. On Linux its
      # transitive dbus binding needs the system development metadata; without
      # this, the release build fails before the artifact smoke gate can run.
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes pkg-config libdbus-1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: cli-${{ matrix.target.triple }}

      - name: Resolve identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "tag is required" >&2
            exit 1
          fi
          SHA="$(git rev-parse HEAD)"
          EXPECTED="${{ inputs.git_sha }}"
          if [ -n "$EXPECTED" ] && [ "$SHA" != "$EXPECTED" ]; then
            echo "CLI builder checkout $SHA != expected $EXPECTED" >&2
            exit 1
          fi
          DESCRIBE="${{ inputs.git_describe }}"
          if [ -z "$DESCRIBE" ]; then
            DESCRIBE="$(git describe --always --dirty --tags 2>/dev/null || echo "$SHA")"
          fi
          CHANNEL="${{ inputs.channel || 'installed' }}"
          VERSION="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "git_sha=$SHA"
            echo "git_describe=$DESCRIBE"
            echo "channel=$CHANNEL"
          } >> "$GITHUB_OUTPUT"
          echo "CLI identity: tag=$TAG sha=$SHA describe=$DESCRIBE channel=$CHANNEL"

      - name: Fail closed if identity empty
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ steps.identity.outputs.git_sha }}"
          test -n "${{ steps.identity.outputs.git_describe }}"
          test -n "${{ steps.identity.outputs.channel }}"
          test -n "${{ steps.identity.outputs.version }}"

      - name: Build contextdesk (locked)
        shell: bash
        env:
          CD_GIT_SHA: ${{ steps.identity.outputs.git_sha }}
          CD_GIT_DESCRIBE: ${{ steps.identity.outputs.git_describe }}
          CD_CHANNEL: ${{ steps.identity.outputs.channel }}
        run: |
          set -euo pipefail
          cargo build -p cd-cli --release --locked --target ${{ matrix.target.triple }}

      - name: Locate binary
        id: bin
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target.triple }}/release/${{ matrix.target.exe }}"
          test -f "$BIN"
          echo "path=$BIN" >> "$GITHUB_OUTPUT"

      - name: Smoke test artifact
        shell: bash
        env:
          CONTEXTDESK_BIN: ${{ steps.bin.outputs.path }}
          EXPECT_GIT_SHA: ${{ steps.identity.outputs.git_sha }}
          EXPECT_CHANNEL: ${{ steps.identity.outputs.channel }}
          EXPECT_DESCRIBE: ${{ steps.identity.outputs.git_describe }}
          # Smoke is mandatory — do not set CLI_SMOKE_SKIP in release.
          CLI_SMOKE_REQUIRED: "1"
        run: |
          set -euo pipefail
          bash scripts/cli-release/smoke_cli_artifact.sh

      - name: Package archive
        id: package
        shell: bash
        env:
          CONTEXTDESK_BIN: ${{ steps.bin.outputs.path }}
          CLI_VERSION: ${{ steps.identity.outputs.version }}
          CLI_PLATFORM: ${{ matrix.target.platform }}
          CLI_GIT_SHA: ${{ steps.identity.outputs.git_sha }}
          CLI_GIT_DESCRIBE: ${{ steps.identity.outputs.git_describe }}
          CLI_CHANNEL: ${{ steps.identity.outputs.channel }}
          CLI_TRIPLE: ${{ matrix.target.triple }}
          CLI_OUT_DIR: dist/cli
        run: |
          set -euo pipefail
          python3 scripts/cli-release/package_cli_release.py package
          ARCHIVE=$(ls dist/cli/contextdesk-*-${{ matrix.target.platform }}.${{ matrix.target.archive_ext }} | head -1)
          test -f "$ARCHIVE"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "archive_name=$(basename "$ARCHIVE")" >> "$GITHUB_OUTPUT"

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target.platform }}
          path: |
            dist/cli/contextdesk-*-${{ matrix.target.platform }}.*
            dist/cli/build-info-${{ matrix.target.platform }}.json
          if-no-files-found: error

  # Aggregate CLI-only checksums as Actions artifacts. GitHub Releases are
  # owned exclusively by `.github/workflows/release.yml`.
  package-cli-artifacts:
    name: package-cli-artifacts
    needs: build-cli
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha || inputs.tag }}
          fetch-depth: 0

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/download
          pattern: cli-*
          merge-multiple: false

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Assemble release assets
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          # Collect every platform archive
          found=0
          for platform in macos-arm64 macos-x64 linux-x64 windows-x64; do
            dir="dist/download/cli-${platform}"
            if [ ! -d "$dir" ]; then
              echo "MISSING platform artifact dir: $platform" >&2
              exit 1
            fi
            count=$(find "$dir" -type f \( -name 'contextdesk-*.tar.gz' -o -name 'contextdesk-*.zip' \) | wc -l | tr -d ' ')
            if [ "$count" -lt 1 ]; then
              echo "MISSING archive for platform: $platform" >&2
              exit 1
            fi
            cp -a "$dir"/* dist/release/ || true
            found=$((found + 1))
          done
          if [ "$found" -ne 4 ]; then
            echo "expected 4 platforms, found $found" >&2
            exit 1
          fi
          python3 scripts/cli-release/package_cli_release.py aggregate \
            --dir dist/release \
            --version "${{ steps.tag.outputs.version }}" \
            --git-sha "$(git rev-parse HEAD)" \
            --git-describe "$(git describe --always --dirty --tags 2>/dev/null || git rev-parse HEAD)" \
            --channel "${{ inputs.channel || 'installed' }}"
          test -f dist/release/SHA256SUMS
          test -f dist/release/sbom.cdx.json
          # Fail closed: must not claim published
          python3 scripts/cli-release/package_cli_release.py assert-draft-only \
            --manifest dist/release/release-manifest.json
          ls -la dist/release | tee dist/release/inventory.txt

      - name: Attest build provenance (when supported)
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/release/contextdesk-*.tar.gz
            dist/release/contextdesk-*.zip
            dist/release/SHA256SUMS
            dist/release/sbom.cdx.json

      - name: Upload CLI artifact bundle (no GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: cli-release-bundle
          path: |
            dist/release/contextdesk-*.tar.gz
            dist/release/contextdesk-*.zip
            dist/release/SHA256SUMS
            dist/release/sbom.cdx.json
            dist/release/release-manifest.json
            dist/release/inventory.txt
            dist/release/build-info-*.json
          if-no-files-found: error
