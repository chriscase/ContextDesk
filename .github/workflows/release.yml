# Tag-driven desktop installers (#172). Not run on PR/main — only v* tags + workflow_dispatch.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name for the draft release (e.g. v0.1.0-rc1)"
        required: true
        type: string
      signed_updater:
        description: "Require signed updater artifacts (needs a valid TAURI_SIGNING_PRIVATE_KEY)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  desktop-bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          # Keep the packaged Linux host aligned with gui-accept. The shipped
          # ort-sys prebuilts require glibc >= 2.38 (__isoc23_* symbols), so
          # Ubuntu 22.04 cannot link the production desktop binary.
          - platform: ubuntu-24.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux deps (WebKit / appindicator)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y \
            libdbus-1-dev pkg-config libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop/src-tauri

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      - name: Build frontend + generate tauri conf
        working-directory: desktop
        env:
          CONTEXTDESK_SIGNED_UPDATER: ${{ (github.ref_type == 'tag' || inputs.signed_updater) && 'true' || 'false' }}
        run: |
          node scripts/gen-tauri-conf.mjs
          node -e "const fs=require('node:fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));if(process.env.CONTEXTDESK_SIGNED_UPDATER!=='true'){c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')}"
          npm run build

      - name: Bundle desktop (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ed25519 minisign private key for updater artifacts (#173).
          # Set repo secrets TAURI_SIGNING_PRIVATE_KEY (+ optional PASSWORD).
          # Public key is committed in desktop/src-tauri/tauri.conf.json plugins.updater.pubkey.
          TAURI_SIGNING_PRIVATE_KEY: ${{ (github.ref_type == 'tag' || inputs.signed_updater) && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ (github.ref_type == 'tag' || inputs.signed_updater) && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          projectPath: desktop
          # Draft so operators can smoke-test before publishing.
          releaseDraft: true
          # Attach latest.json + signatures when createUpdaterArtifacts is true (#173).
          includeUpdaterJson: ${{ github.ref_type == 'tag' || inputs.signed_updater }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseBody: |
            Desktop installers for ContextDesk (draft).

            Built by `.github/workflows/release.yml` (#172 + #173 updater artifacts).
            Code signing / notarization is operator-owned (see docs/PACKAGING.md).
            Signed updater metadata is attached only when explicitly enabled with a valid operator key.
          args: ${{ matrix.args }}
