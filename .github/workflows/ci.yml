name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Number of shards the Ubuntu workspace test suite is split into (#874).
  # `strategy.matrix` cannot read the env context, so the shard list below is
  # spelled out literally; the aggregate job fails closed if the two ever
  # disagree. Cache key `ubuntu-workspace-tests` is shared by rust-ubuntu
  # (the only writer) and every shard (`save-if: false` so they restore but
  # do not save). Do not set Swatinem `lookup-only: true` on shards: that
  # checks the key without downloading files. Probes also set `save-if: false`;
  # a lookup-only probe must never create a partial cache before warmup runs.
  # Per-OS shared keys (`ubuntu-workspace-tests`, `macos-latest-workspace-tests-v2`,
  # `windows-latest-workspace-tests-v2`) plus rust-cache's own key (runner OS/
  # arch, rustc, Cargo.lock, and default env prefixes CARGO/CC/CFLAGS/CXX/
  # CMAKE/RUST — which already includes RUSTFLAGS) keep caches from crossing
  # OS or compile flags. Do not set `env-vars:` unless adding a *new* prefix;
  # setting it does not replace the defaults, and RUSTFLAGS is already hashed.
  #
  # Raised 4 -> 8 after the shard carrying `cd-core/lib/other` was cancelled at
  # the 60-minute job budget on two consecutive runs of PR #892 (31888581827,
  # 31897532947), each time leaving its 29 units unrun and failing the
  # aggregate at `coverage: 87/116`. The other three shards finished in 16-33
  # minutes, so the partition — not the tree — was the problem.
  #
  # 8 rather than 6 because a shard's cost is build + tests and only the test
  # half shrinks when units are spread: hosted shard 4 reported `build time:
  # 710s` of a `total time: 1203s` on a warm cache. At 6 shards the
  # `cd-core/lib/other` shard still draws 19 of 116 units, which lands near the
  # 50-minute step timeout; at 8 it draws 15. If that shard ever overruns
  # again, the next lever is a `lib_splits` entry for `cd-core/lib/other` in
  # scripts/ci_shard_plan.sh — the same mechanism that already split
  # `cd-core/lib` into `log_analysis` and `other` — not a further count bump.
  CD_SHARD_COUNT: "8"

# Keep every main-branch run, but stop spending runner time on an obsolete PR
# revision once a newer commit for the same PR has started CI.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  claims:
    name: claim↔code guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check Shipped anchors in docs/CLAIMS.md
        run: |
          sh scripts/check_claims_test.sh
          sh scripts/check_claims.sh

  close-proof:
    name: close-proof discipline (#254)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: offline self-tests + fixtures (SHA, pasted-proof, duplicate bodies)
        run: |
          # Hard gate: exercises the matchers and duplicate detection offline.
          sh scripts/check_close_proof.sh --offline
          # Per-record fixture (includes a SHA-but-no-proof case that must be rejected).
          sh scripts/check_close_proof.sh --fixture scripts/fixtures/close_proof_sample.json
          # Duplicate-body fixture: must print a DUPLICATE flag and classify the pair as failing.
          out=$(sh scripts/check_close_proof.sh --fixture scripts/fixtures/close_proof_dupes.json)
          printf '%s\n' "$out"
          echo "$out" | grep -q "^DUPLICATE:" || { echo "expected a DUPLICATE flag" >&2; exit 1; }
      - name: enforce live remediation closes (blocking, scoped after cutoff)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Enforcement begins strictly AFTER this date. All remediation history
          # was closed on/before 2026-07-18, so this never breaks past closes;
          # it hard-fails only issues closed 2026-07-19 or later that lack a SHA
          # or pasted proof in their closing comment, or that duplicate another
          # issue's closing body. See docs/CLOSE_PROOF.md.
          CLOSE_PROOF_CUTOFF: "2026-07-18"
        run: sh scripts/check_close_proof.sh

  gui-accept-contracts:
    name: GUI integration contracts (no WebDriver)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/gui-accept
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/gui-accept/package-lock.json
      - run: npm ci
      - run: npm test

  ci-path-filter:
    name: CI path routing
    runs-on: ubuntu-latest
    outputs:
      surface: ${{ steps.classify.outputs.surface }}
      run_ubuntu: ${{ steps.classify.outputs.run_ubuntu }}
      changed_count: ${{ steps.classify.outputs.changed_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: path routing self-test
        run: sh scripts/tests/ci_path_filter_test.sh
      - name: classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          # Path-aware skipping is PR feedback only. Every push to main gets
          # the complete Ubuntu workspace gate, including bench-only commits.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
              git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --no-tags origin "$BASE_SHA"
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
            else
              git ls-files > changed-files.txt
            fi
          else
            git ls-files > changed-files.txt
          fi
          echo "Changed paths:"
          sed 's/^/- /' changed-files.txt
          result=$(sh scripts/ci_classify_paths.sh < changed-files.txt)
          printf '%s\n' "$result" >> "$GITHUB_OUTPUT"
          surface=$(printf '%s\n' "$result" | awk -F= '$1 == "surface" { print $2 }')
          run_ubuntu=$(printf '%s\n' "$result" | awk -F= '$1 == "run_ubuntu" { print $2 }')
          changed_count=$(printf '%s\n' "$result" | awk -F= '$1 == "changed_count" { print $2 }')
          {
            echo "### CI path routing"
            echo "- Surface: `$surface`"
            echo "- Changed paths: $changed_count"
            if [ "$run_ubuntu" = true ]; then
              echo "- Ubuntu workspace shards: required"
            else
              echo "- Ubuntu workspace shards: not required for this isolated surface"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # macOS / Windows take a quick exact-key probe first. A miss starts one
  # cache-writer warmup; a hit skips that writer and lets the restore-only
  # preflight and complete four-way suite start immediately. The platform
  # aggregates are coverage signals; Ubuntu keeps its existing exact required
  # check name and warmup -> shard -> aggregate gate.
  rust-macos-cache-probe:
    name: rust cache probe (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 10
    outputs:
      cache-hit: ${{ steps.rust-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          shared-key: macos-latest-workspace-tests-v2
          cache-workspace-crates: true
          lookup-only: true
          save-if: false

  rust-windows-cache-probe:
    name: rust cache probe (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      cache-hit: ${{ steps.rust-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          shared-key: windows-latest-workspace-tests-v2
          cache-workspace-crates: true
          lookup-only: true
          save-if: false

  rust-macos-cache-warmup:
    name: rust cache warmup (macos-latest)
    needs: [rust-macos-cache-probe]
    if: needs.rust-macos-cache-probe.outputs.cache-hit != 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          shared-key: macos-latest-workspace-tests-v2
          cache-workspace-crates: true
          # rust-cache saves in a post step when the job succeeds or
          # CACHE_ON_FAILURE is true. Keep this false so a failed --no-run
          # or DuckDB assert cannot publish a hollow target tree.
          cache-on-failure: false
          lookup-only: false
          save-if: true
      - name: record cache writer
        shell: bash
        run: |
          mkdir -p ci-platform-shards
          fp=$(sh scripts/ci_cache_fingerprint.sh --os macos-latest | awk -F= '$1 == "fingerprint" { print $2 }')
          sh scripts/ci_record_cache.sh \
            --out ci-platform-shards/cache-warmup-status.json \
            --hit '${{ steps.rust-cache.outputs.cache-hit }}' \
            --role warmup \
            --shared-key macos-latest-workspace-tests-v2 \
            --save true \
            --fingerprint "$fp"
      - name: compile workspace tests (cache warmup)
        env:
          RUST_TEST_THREADS: "4"
          CARGO_BUILD_JOBS: "4"
        shell: bash
        run: |
          (
            waited=0
            while sleep 60; do
              waited=$((waited + 60))
              echo "[macos-latest cache warmup] cargo test --workspace --no-run still running after ${waited}s ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            done
          ) &
          hb=$!
          set +e
          cargo test --workspace --no-run
          rc=$?
          set -e
          kill "$hb" 2>/dev/null || true
          wait "$hb" 2>/dev/null || true
          exit "$rc"
      - name: require compiled DuckDB artifacts
        shell: bash
        run: sh scripts/ci_record_cache.sh --assert-dir target
      - name: upload cache warmup status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-macos-latest-cache-warmup-status
          path: ci-platform-shards/cache-warmup-status.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  rust-windows-cache-warmup:
    name: rust cache warmup (windows-latest)
    needs: [rust-windows-cache-probe]
    if: needs.rust-windows-cache-probe.outputs.cache-hit != 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          shared-key: windows-latest-workspace-tests-v2
          cache-workspace-crates: true
          # rust-cache saves in a post step when the job succeeds or
          # CACHE_ON_FAILURE is true. Keep this false so a failed --no-run
          # or DuckDB assert cannot publish a hollow target tree.
          cache-on-failure: false
          lookup-only: false
          save-if: true
      - name: record cache writer
        shell: bash
        run: |
          mkdir -p ci-platform-shards
          fp=$(sh scripts/ci_cache_fingerprint.sh --os windows-latest | awk -F= '$1 == "fingerprint" { print $2 }')
          sh scripts/ci_record_cache.sh \
            --out ci-platform-shards/cache-warmup-status.json \
            --hit '${{ steps.rust-cache.outputs.cache-hit }}' \
            --role warmup \
            --shared-key windows-latest-workspace-tests-v2 \
            --save true \
            --fingerprint "$fp"
      - name: compile workspace tests (cache warmup)
        env:
          RUST_TEST_THREADS: "4"
          CARGO_BUILD_JOBS: "4"
        shell: bash
        run: |
          (
            waited=0
            while sleep 60; do
              waited=$((waited + 60))
              echo "[windows-latest cache warmup] cargo test --workspace --no-run still running after ${waited}s ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            done
          ) &
          hb=$!
          set +e
          cargo test --workspace --no-run
          rc=$?
          set -e
          kill "$hb" 2>/dev/null || true
          wait "$hb" 2>/dev/null || true
          exit "$rc"
      - name: require compiled DuckDB artifacts
        shell: bash
        run: sh scripts/ci_record_cache.sh --assert-dir target
      - name: upload cache warmup status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-windows-latest-cache-warmup-status
          path: ci-platform-shards/cache-warmup-status.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # Restore-only preflight signals. Each OS waits only on its own probe and
  # optional warmup so a slow Windows writer cannot stall macOS, and vice
  # versa. These jobs do not compile or execute the workspace suite; the
  # per-OS shards below remain mandatory. Check names stay
  # `rust (macos-latest)` and `rust (windows-latest)`.
  rust-macos:
    name: rust (macos-latest)
    needs:
      - rust-macos-cache-probe
      - rust-macos-cache-warmup
    # Run even when the probe/writer fails or the writer is skipped on a hit
    # so the preflight check fails closed instead of disappearing.
    if: always()
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          shared-key: macos-latest-workspace-tests-v2
          cache-workspace-crates: true
          lookup-only: false
          save-if: false
      - name: record cache restore
        shell: bash
        run: |
          mkdir -p ci-platform-shards
          fp=$(sh scripts/ci_cache_fingerprint.sh --os macos-latest | awk -F= '$1 == "fingerprint" { print $2 }')
          sh scripts/ci_record_cache.sh \
            --out ci-platform-shards/cache-status.json \
            --hit '${{ steps.rust-cache.outputs.cache-hit }}' \
            --role preflight \
            --shared-key macos-latest-workspace-tests-v2 \
            --save false \
            --restore-dir target \
            --fingerprint "$fp"
          echo "CD_CACHE_STATE=$(jq -r .cache_state ci-platform-shards/cache-status.json)" >> "$GITHUB_ENV"
      - name: require warm cache
        shell: bash
        run: |
          if [ "${CD_CACHE_STATE:-cold}" != warm ]; then
            echo "::error title=preflight cache cold::macos-latest preflight cannot validate the restored workspace"
            cat ci-platform-shards/cache-status.json
            exit 1
          fi
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: embed_host example build (#170)
        run: cargo build -p cd-core --examples
      - name: server smoke
        run: cargo run -p cd-server -- --print-branding
      - name: upload cache status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-macos-latest-cache-status
          path: ci-platform-shards/cache-status.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  rust-windows:
    name: rust (windows-latest)
    needs:
      - rust-windows-cache-probe
      - rust-windows-cache-warmup
    if: always()
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          shared-key: windows-latest-workspace-tests-v2
          cache-workspace-crates: true
          lookup-only: false
          save-if: false
      - name: record cache restore
        shell: bash
        run: |
          mkdir -p ci-platform-shards
          fp=$(sh scripts/ci_cache_fingerprint.sh --os windows-latest | awk -F= '$1 == "fingerprint" { print $2 }')
          sh scripts/ci_record_cache.sh \
            --out ci-platform-shards/cache-status.json \
            --hit '${{ steps.rust-cache.outputs.cache-hit }}' \
            --role preflight \
            --shared-key windows-latest-workspace-tests-v2 \
            --save false \
            --restore-dir target \
            --fingerprint "$fp"
          echo "CD_CACHE_STATE=$(jq -r .cache_state ci-platform-shards/cache-status.json)" >> "$GITHUB_ENV"
      - name: require warm cache
        shell: bash
        run: |
          if [ "${CD_CACHE_STATE:-cold}" != warm ]; then
            echo "::error title=preflight cache cold::windows-latest preflight cannot validate the restored workspace"
            cat ci-platform-shards/cache-status.json
            exit 1
          fi
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: embed_host example build (#170)
        run: cargo build -p cd-core --examples
      - name: server smoke
        run: cargo run -p cd-server -- --print-branding
      - name: upload cache status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-windows-latest-cache-status
          path: ci-platform-shards/cache-status.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # Ubuntu fmt/clippy/examples/smoke plus the one cache write for the test
  # shards. Hosted runs 31828397526 and 31835229724 were all cache misses
  # (`No cache found` in 1-2s) because only shard 1 was allowed to save and
  # shard 1 died before the cache post-step — so every retry stayed cold and
  # each shard compiled DuckDB for 36-55 minutes.
  rust-ubuntu:
    name: rust (ubuntu-latest)
    needs: [ci-path-filter]
    if: needs.ci-path-filter.outputs.run_ubuntu == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux keyring deps
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y libdbus-1-dev pkg-config
      - name: Free disk space (bundled DuckDB build is large, #358)
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc
          df -h /
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          shared-key: ubuntu-workspace-tests
          cache-workspace-crates: true
          # rust-cache saves in a post step when the job succeeds or
          # CACHE_ON_FAILURE is true. Keep this false so a failed --no-run
          # or DuckDB assert cannot publish a hollow target tree.
          cache-on-failure: false
      - name: record cache restore
        run: |
          mkdir -p ci-shards
          fp=$(sh scripts/ci_cache_fingerprint.sh --os ubuntu-latest | awk -F= '$1 == "fingerprint" { print $2 }')
          sh scripts/ci_record_cache.sh \
            --out ci-shards/cache-status.json \
            --hit '${{ steps.rust-cache.outputs.cache-hit }}' \
            --role warmup \
            --shared-key ubuntu-workspace-tests \
            --save true \
            --fingerprint "$fp"
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (workspace, all targets)
        run: |
          (
            waited=0
            while sleep 60; do
              waited=$((waited + 60))
              echo "[ubuntu rust] clippy still running after ${waited}s ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            done
          ) &
          hb=$!
          set +e
          cargo clippy --workspace --all-targets -- -D warnings
          rc=$?
          set -e
          kill "$hb" 2>/dev/null || true
          wait "$hb" 2>/dev/null || true
          exit "$rc"
      - name: compile workspace tests (cache warmup)
        # One compile of DuckDB/workspace test binaries. Shards restore this
        # cache with save-if: false (they must actually download the files).
        # and should restore this entry. CARGO_BUILD_JOBS=2 matches the 2-core
        # hosted runner; test execution stays single-threaded on the shards.
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          (
            waited=0
            while sleep 60; do
              waited=$((waited + 60))
              echo "[warmup] cargo test --workspace --no-run still running after ${waited}s ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            done
          ) &
          hb=$!
          set +e
          cargo test --workspace --no-run
          rc=$?
          set -e
          kill "$hb" 2>/dev/null || true
          wait "$hb" 2>/dev/null || true
          exit "$rc"
      - name: require compiled DuckDB artifacts
        run: sh scripts/ci_record_cache.sh --assert-dir target
      - name: embed_host example build (#170)
        run: cargo build -p cd-core --examples
      - name: server smoke
        run: cargo run -p cd-server -- --print-branding
      - name: upload cache status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-ubuntu-cache-status
          path: ci-shards/cache-status.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  rust-ubuntu-shard:
    name: rust tests (ubuntu shard ${{ matrix.shard }})
    needs: [ci-path-filter, rust-ubuntu]
    if: needs.ci-path-filter.outputs.run_ubuntu == 'true'
    runs-on: ubuntu-latest
    # Tests only, after the warmup job has compiled. 50 minutes is enough for
    # the known 525s integration target plus `cd-core/lib` splits, and is
    # below the ~86-96 minute hosted-runner-loss window from runs
    # 31828397526 / 31835229724. A step timeout (below) leaves the runner
    # alive so always() diagnostics can upload.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with CD_SHARD_COUNT (see the workflow `env` block).
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux keyring deps
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y libdbus-1-dev pkg-config
      - name: Free disk space (bundled DuckDB build is large, #358)
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc
          df -h /
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          shared-key: ubuntu-workspace-tests
          cache-workspace-crates: true
          # save-if: false restores files and skips the save post-step.
          # lookup-only: true would set cache-hit without downloading (run
          # 31845262696): shards compiled 11–12 min while recording warm.
          lookup-only: false
          save-if: false
      - name: record cache restore
        run: |
          mkdir -p ci-shards
          # restore-dir keeps cache_state honest: lookup-only reports a hit
          # without downloading files (run 31845262696 compiled 11–12 min
          # while recording warm). Warm now also requires compiled deps and
          # bundled DuckDB, not just a non-empty target/.
          fp=$(sh scripts/ci_cache_fingerprint.sh --os ubuntu-latest | awk -F= '$1 == "fingerprint" { print $2 }')
          sh scripts/ci_record_cache.sh \
            --out ci-shards/cache-status.json \
            --hit '${{ steps.rust-cache.outputs.cache-hit }}' \
            --role shard \
            --shard '${{ matrix.shard }}' \
            --shared-key ubuntu-workspace-tests \
            --save false \
            --restore-dir target \
            --fingerprint "$fp"
          echo "CD_CACHE_STATE=$(jq -r .cache_state ci-shards/cache-status.json)" >> "$GITHUB_ENV"
      - name: shard plan (deterministic, exhaustive)
        run: sh scripts/ci_shard_plan.sh verify --shards "$CD_SHARD_COUNT"
      - name: run shard ${{ matrix.shard }}
        # Keep an explicit deadline below the step timeout. GNU timeout sends
        # TERM to ci_run_shard.sh, which writes its in-flight snapshot, then
        # leaves a grace window for the marker, diagnostics, and upload.
        # The outer step timeout remains a final safety net; it is not raised.
        timeout-minutes: 50
        env:
          RUST_TEST_THREADS: "1"
          CARGO_BUILD_JOBS: "2"
        run: |
          set +e
          timeout --signal=TERM --kill-after=60s 45m \
            stdbuf -oL -eL sh scripts/ci_run_shard.sh \
              --shard "${{ matrix.shard }}" \
              --shards "$CD_SHARD_COUNT" \
              --out ci-shards
          rc=$?
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            sh scripts/ci_mark_shard_timeout.sh \
              --dir ci-shards \
              --shard "${{ matrix.shard }}" \
              --shards "$CD_SHARD_COUNT" \
              --reason step-deadline
            exit 1
          fi
          exit "$rc"
      - name: shard diagnostic summary
        if: always()
        run: |
          if [ -f ci-shards/cache-status.json ]; then
            echo "cache-status:"
            cat ci-shards/cache-status.json
            echo
          fi
          sh scripts/ci_run_shard.sh --summary ci-shards || true
      - name: upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-ubuntu-shard-${{ matrix.shard }}
          path: ci-shards/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  rust-ubuntu-tests:
    name: rust tests (ubuntu aggregate)
    needs: [ci-path-filter, rust-ubuntu-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: require valid CI routing
        env:
          PATH_FILTER_RESULT: ${{ needs.ci-path-filter.result }}
          SURFACE: ${{ needs.ci-path-filter.outputs.surface }}
          RUN_UBUNTU: ${{ needs.ci-path-filter.outputs.run_ubuntu }}
        run: |
          set -eu
          if [ "$PATH_FILTER_RESULT" != success ]; then
            echo "::error title=CI path routing::ci-path-filter reported '$PATH_FILTER_RESULT'"
            exit 1
          fi
          case "$SURFACE:$RUN_UBUNTU" in
            full:true|bench-only:false|collab-only:false) ;;
            *)
              echo "::error title=CI path routing::invalid route '$SURFACE:$RUN_UBUNTU'"
              exit 1
              ;;
          esac
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: run isolated bench validation
        if: needs.ci-path-filter.outputs.surface == 'bench-only'
        run: cargo test -p cd-triage-bench --all-targets
      - name: record isolated collab routing
        if: needs.ci-path-filter.outputs.surface == 'collab-only'
        run: |
          if [ -d collab ] || [ -d crates/cd-collab ]; then
            echo "::error::collaboration source is present but has no dedicated validator; refusing a green filtered gate"
            exit 1
          fi
          echo "No collaboration workspace crate is present on this revision; path-only collaboration documentation needs no Rust shard run."
          git diff --check
      - name: download shard results
        if: needs.ci-path-filter.outputs.run_ubuntu == 'true'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: rust-ubuntu-shard-*
          path: shard-results
      - name: shard tooling self-test
        if: needs.ci-path-filter.outputs.run_ubuntu == 'true'
        run: sh scripts/tests/ci_shard_test.sh
      - name: per-shard diagnostics
        if: needs.ci-path-filter.outputs.run_ubuntu == 'true'
        run: sh scripts/ci_run_shard.sh --summary shard-results || true
      - name: aggregate shard results (fail closed)
        if: needs.ci-path-filter.outputs.run_ubuntu == 'true'
        run: sh scripts/ci_aggregate_shards.sh --dir shard-results --shards "$CD_SHARD_COUNT"
      - name: every shard job must have succeeded
        if: needs.ci-path-filter.outputs.run_ubuntu == 'true'
        run: |
          result='${{ needs.rust-ubuntu-shard.result }}'
          echo "shard matrix result: $result"
          if [ "$result" != success ]; then
            echo "::error title=ubuntu test shards::shard matrix reported '$result'"
            exit 1
          fi

  # A platform shard restores the cache-writer's complete target directory and
  # runs its deterministic quarter of the workspace plan. `save-if: false` is
  # intentional: one platform warmup owns the cache write, while all four
  # shards consume it without racing to save partial target trees. Each OS
  # waits only on its own probe/warmup.
  rust-macos-shard:
    name: rust tests (macos-latest shard ${{ matrix.shard }})
    needs:
      - rust-macos-cache-probe
      - rust-macos-cache-warmup
    if: always()
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          shared-key: macos-latest-workspace-tests-v2
          cache-workspace-crates: true
          lookup-only: false
          save-if: false
      - name: record cache restore
        shell: bash
        run: |
          mkdir -p ci-platform-shards
          fp=$(sh scripts/ci_cache_fingerprint.sh --os macos-latest | awk -F= '$1 == "fingerprint" { print $2 }')
          sh scripts/ci_record_cache.sh \
            --out ci-platform-shards/cache-status.json \
            --hit '${{ steps.rust-cache.outputs.cache-hit }}' \
            --role shard \
            --shard '${{ matrix.shard }}' \
            --shared-key macos-latest-workspace-tests-v2 \
            --save false \
            --restore-dir target \
            --fingerprint "$fp"
          echo "CD_CACHE_STATE=$(jq -r .cache_state ci-platform-shards/cache-status.json)" >> "$GITHUB_ENV"
      - name: shard plan (deterministic, exhaustive)
        shell: bash
        run: sh scripts/ci_shard_plan.sh verify --shards 4
      - name: require warm cache
        shell: bash
        run: |
          if [ "${CD_CACHE_STATE:-cold}" != warm ]; then
            echo "::error title=platform cache cold::macos-latest shard cannot safely duplicate the workspace build"
            cat ci-platform-shards/cache-status.json
            exit 1
          fi
      - name: run macos-latest shard ${{ matrix.shard }}
        timeout-minutes: 50
        shell: bash
        env:
          RUST_TEST_THREADS: "1"
          CARGO_BUILD_JOBS: "4"
        run: |
          sh scripts/ci_run_platform_shard.sh \
            --os macos \
            --shard "${{ matrix.shard }}" \
            --shards 4 \
            --out ci-platform-shards
      - name: shard diagnostic summary
        if: always()
        shell: bash
        run: |
          if [ -f ci-platform-shards/cache-status.json ]; then
            cat ci-platform-shards/cache-status.json
          fi
          sh scripts/ci_run_shard.sh --summary ci-platform-shards || true
      - name: upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-macos-latest-shard-${{ matrix.shard }}
          path: ci-platform-shards/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  rust-windows-shard:
    name: rust tests (windows-latest shard ${{ matrix.shard }})
