          fi
          sh scripts/ci_run_shard.sh --summary ci-platform-shards || true
      - name: upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-windows-latest-shard-${{ matrix.shard }}
          path: ci-platform-shards/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  rust-macos-tests:
    name: rust tests (macos-latest aggregate)
    needs: [rust-macos-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: download macos-latest shard results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: rust-macos-latest-shard-*
          path: platform-results
      - name: shard tooling self-test
