name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Number of shards the Ubuntu workspace test suite is split into (#874).
  # `strategy.matrix` cannot read the env context, so the shard list below is
  # spelled out literally; the aggregate job fails closed if the two ever
  # disagree (a missing index, or an index above this count).
  CD_SHARD_COUNT: "4"

# Keep every main-branch run, but stop spending runner time on an obsolete PR
# revision once a newer commit for the same PR has started CI.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  claims:
    name: claim↔code guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check Shipped anchors in docs/CLAIMS.md
        run: |
          sh scripts/check_claims_test.sh
          sh scripts/check_claims.sh

  close-proof:
    name: close-proof discipline (#254)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: offline self-tests + fixtures (SHA, pasted-proof, duplicate bodies)
        run: |
          # Hard gate: exercises the matchers and duplicate detection offline.
          sh scripts/check_close_proof.sh --offline
          # Per-record fixture (includes a SHA-but-no-proof case that must be rejected).
          sh scripts/check_close_proof.sh --fixture scripts/fixtures/close_proof_sample.json
          # Duplicate-body fixture: must print a DUPLICATE flag and classify the pair as failing.
          out=$(sh scripts/check_close_proof.sh --fixture scripts/fixtures/close_proof_dupes.json)
          printf '%s\n' "$out"
          echo "$out" | grep -q "^DUPLICATE:" || { echo "expected a DUPLICATE flag" >&2; exit 1; }
      - name: enforce live remediation closes (blocking, scoped after cutoff)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Enforcement begins strictly AFTER this date. All remediation history
          # was closed on/before 2026-07-18, so this never breaks past closes;
          # it hard-fails only issues closed 2026-07-19 or later that lack a SHA
          # or pasted proof in their closing comment, or that duplicate another
          # issue's closing body. See docs/CLOSE_PROOF.md.
          CLOSE_PROOF_CUTOFF: "2026-07-18"
        run: sh scripts/check_close_proof.sh

  gui-accept-contracts:
    name: GUI integration contracts (no WebDriver)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/gui-accept
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/gui-accept/package-lock.json
      - run: npm ci
      - run: npm test

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Three-OS core matrix (#178): keychain naming + paths must stay offline-safe.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux keyring deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Free disk space (Linux — bundled DuckDB build is large, #358)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc
          df -h /
      - uses: Swatinem/rust-cache@v2
        with:
          # Cache workspace crates as well as dependencies so fresh runners
          # do not repeatedly rebuild the large local workspace.
          # The action's normal OS/toolchain/lockfile keying remains in force.
          cache-workspace-crates: true
          # Preserve useful cache material when a later lint/test step fails.
          cache-on-failure: true
      - name: fmt
        # rustfmt is OS-agnostic; still run on all three for early signal.
        run: cargo fmt --all -- --check
      - name: clippy (workspace, all targets)
        # Lints libs, bins, and tests (#162).
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test workspace (macOS/Windows)
        # cd-core + cd-server (incl. tenant isolation) (#160); offline, no real keychain (#178).
        # Unchanged for macOS and Windows, which finish this step normally.
        # Linux runs the same suite in the `rust-ubuntu-shard` matrix below: as
        # one step it ran 70-80 minutes and a lost runner left the step
        # `in_progress` with no log blob at all (#874). The single-threaded
        # Linux constraint moved with it, so nothing about the suite is relaxed.
        if: runner.os != 'Linux'
        env:
          RUST_TEST_THREADS: "4"
          CARGO_BUILD_JOBS: "4"
        run: cargo test --workspace
      - name: embed_host example build (#170)
        # Keeps crates/cd-core/examples/embed_host from rotting.
        run: cargo build -p cd-core --examples
      - name: server smoke
        run: cargo run -p cd-server -- --print-branding

  # Linux half of the workspace test gate (#874). Same tests as
  # `cargo test --workspace`, split into CD_SHARD_COUNT deterministic shards so
  # a shard is bounded, announces every test target it starts, and leaves
  # per-shard logs behind even when it fails. Coverage is enforced by
  # `rust-ubuntu-tests` below, not by trust.
  rust-ubuntu-shard:
    name: rust tests (ubuntu shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # A warm shard is a quarter of a suite that took 70-80 minutes as one
    # step. A cold one also compiles the whole dependency graph itself — the
    # clippy step that used to warm it lives in the `rust` job — and does it at
    # CARGO_BUILD_JOBS=1: locally, that build takes ten minutes with four build
    # jobs, so serialized it is the dominant cost of a cold run. Hence a cap
    # that a cold run cannot trip by being slow, well under the 6h default. A
    # hang is caught long before this by the per-unit timeout inside the shard.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with CD_SHARD_COUNT (see the workflow `env` block).
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux keyring deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Free disk space (bundled DuckDB build is large, #358)
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc
          df -h /
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache entry shared by every shard instead of the action's
          # default per-job key. The action's OS/toolchain/lockfile keying
          # stays in force. A later (warm) run can restore workspace crates
          # and DuckDB (#358). A cold run does not: all four jobs start
          # together, miss the cache, and may each compile dependencies.
          shared-key: ubuntu-workspace-tests
          cache-workspace-crates: true
          # Cache keys are immutable, so only one shard writes the shared
          # entry. Shard 1 is the writer; it still saves when the shard
          # fails so the *next* run can restore. A lost shard-1 runner
          # never reaches this post step and writes nothing.
          save-if: ${{ matrix.shard == 1 }}
          cache-on-failure: true
      - name: shard plan (deterministic, exhaustive)
        # Fails closed before anything is built if the partition is not an
        # exact cover of the workspace's test targets.
        run: sh scripts/ci_shard_plan.sh verify --shards "$CD_SHARD_COUNT"
      - name: run shard ${{ matrix.shard }}
        # Same environment constraints as the monolithic step it replaces: the
        # expanded retrieval/triage fixture suite can starve a hosted runner
        # even with bounded parallelism and surface as a lost connection.
        env:
          RUST_TEST_THREADS: "1"
          CARGO_BUILD_JOBS: "1"
        run: |
          sh scripts/ci_run_shard.sh \
            --shard "${{ matrix.shard }}" \
            --shards "$CD_SHARD_COUNT" \
            --out ci-shards
      - name: shard diagnostic summary
        # Runs on failure too: reports the last completed unit, the unit left
        # in flight, and the test counts reached before the shard died.
        if: always()
        run: sh scripts/ci_run_shard.sh --summary ci-shards
      - name: upload shard results
        # Independent per shard, so one dead runner cannot take the other
        # shards' diagnostics down with it.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-ubuntu-shard-${{ matrix.shard }}
          path: ci-shards/
          if-no-files-found: error
          retention-days: 14

  # Fail-closed replacement for the single Ubuntu `cargo test --workspace` gate.
  # A missing shard (lost runner), a failed shard, a shard that stopped early,
  # or a test unit no shard claimed all fail this job.
  rust-ubuntu-tests:
    name: rust tests (ubuntu aggregate)
    needs: [rust-ubuntu-shard]
    # Must run even when a shard failed or vanished: that is the case this job
    # exists to diagnose.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: download shard results
        uses: actions/download-artifact@v4
        # A shard whose runner disappeared uploads nothing. Missing artifacts
        # are named by the aggregate step below rather than failing here with a
        # less useful message.
        continue-on-error: true
        with:
          pattern: rust-ubuntu-shard-*
          path: shard-results
      - name: shard tooling self-test
        # The gate checks its own machinery before it judges the shards:
        # partition, aggregation, and the failure paths that decide whether a
        # red suite can report green. Hermetic, ~10s, no build.
        run: sh scripts/tests/ci_shard_test.sh
      - name: per-shard diagnostics
        run: sh scripts/ci_run_shard.sh --summary shard-results || true
      - name: aggregate shard results (fail closed)
        run: sh scripts/ci_aggregate_shards.sh --dir shard-results --shards "$CD_SHARD_COUNT"
      - name: every shard job must have succeeded
        # Belt and braces: the artifact check above cannot see a job that was
        # cancelled after uploading, so the matrix outcome is gated too.
        run: |
          result='${{ needs.rust-ubuntu-shard.result }}'
          echo "shard matrix result: $result"
          if [ "$result" != success ]; then
            echo "::error title=ubuntu test shards::shard matrix reported '$result'"
            exit 1
          fi

  tauri-host:
    name: tauri host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux deps (keyring + webkit for Tauri link)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          # Native dependency builds remain valid even if a later host gate fails.
          cache-on-failure: true
      - name: fmt
        run: cargo fmt -- --check
      - name: clippy
        run: cargo clippy -- -D warnings
      - name: check
        run: cargo check

  desktop:
    name: desktop ui (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
