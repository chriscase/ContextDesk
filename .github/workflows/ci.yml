      - name: every windows-latest shard job must have succeeded
        run: |
          result='${{ needs.rust-windows-shard.result }}'
          echo "platform shard matrix result: $result"
          if [ "$result" != success ]; then
            echo "::error title=windows-latest test shards::shard matrix reported '$result'"
            exit 1
          fi

  tauri-host:
    name: tauri host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux deps (keyring + webkit for Tauri link)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y libdbus-1-dev pkg-config libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          cache-on-failure: true
      - name: fmt
        run: cargo fmt -- --check
      - name: clippy
        run: cargo clippy -- -D warnings
      - name: check
        run: cargo check

  desktop:
    name: desktop ui (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
