# Evaluation-only Garage v2.3.0 config for ContextDesk S3 evidence qualification.
# Not a production topology. Do not copy into a shared War Room store.
# rpc_secret is a placeholder: the harness replaces it in a generated copy.
# Compose refuses to be useful until that placeholder is gone.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "REPLACE_THIS_VALUE"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"
