# Example local/dev topology. One app service + PostgreSQL.
# Copy to docker-compose.yml and supply secret-store values via .env.
# No company-specific hostnames. TLS terminates at the operator ingress
# (see README.md); this compose is plaintext localhost only.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: collab
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collab"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      COLLAB_HOST: 0.0.0.0
      COLLAB_PORT: "8787"
      COLLAB_SERVICE_NAME: cd-collab
      COLLAB_DATABASE_URL: ${COLLAB_DATABASE_URL}
      COLLAB_MIGRATE_DATABASE_URL: ${COLLAB_MIGRATE_DATABASE_URL}
      COLLAB_EVIDENCE_ROOT: /var/lib/cd-collab/evidence
      COLLAB_STATIC_DIR: /srv/web/dist
      # Optional S3-compatible evidence bytes (server-side only; opt-in).
      # The local control-state root above remains required. Doctor does not
      # contact the bucket. Mount owner-only secret files; do not put keys in
      # this compose file. The object-store role must allow DeleteObject for
      # staging, journal, and rollback cleanup.
      # COLLAB_EVIDENCE_PROVIDER: s3
      # COLLAB_EVIDENCE_S3_ENDPOINT: https://s3.example.test
      # COLLAB_EVIDENCE_S3_REGION: garage
      # COLLAB_EVIDENCE_S3_BUCKET: war-room-evidence
      # COLLAB_EVIDENCE_S3_PREFIX: assigned-prefix
      # COLLAB_EVIDENCE_S3_FORCE_PATH_STYLE: "1"
      # COLLAB_EVIDENCE_S3_ALLOW_HTTP: "0"
      # COLLAB_EVIDENCE_S3_CREDENTIALS_MODE: static
      # COLLAB_EVIDENCE_S3_ACCESS_KEY_ID_FILE: /run/secrets/evidence-s3-access-key-id
      # COLLAB_EVIDENCE_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/evidence-s3-secret-access-key
    volumes:
      - evidence_data:/var/lib/cd-collab/evidence
      # Bind mounts preserve host ownership and mode. Before opting in, the
      # operator must provision these files for the image's node uid (1000)
      # with mode 0400; root-owned or group/world-readable files are refused.
      # - /run/secrets/evidence-s3-access-key-id:/run/secrets/evidence-s3-access-key-id:ro
      # - /run/secrets/evidence-s3-secret-access-key:/run/secrets/evidence-s3-secret-access-key:ro
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["npm", "run", "migrate"]
    environment:
      COLLAB_DATABASE_URL: ${COLLAB_DATABASE_URL}
      COLLAB_MIGRATE_DATABASE_URL: ${COLLAB_MIGRATE_DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  db_data:
  evidence_data:
