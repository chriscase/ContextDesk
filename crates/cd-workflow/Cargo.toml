[package]
name = "cd-workflow"
description = "Host-neutral application/workflow layer: orchestration shared by the Tauri desktop app and the ContextDesk CLI over cd-core primitives"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cd-core = { path = "../cd-core" }
tempfile = "3"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
zip = "2"
cd-test-gateway = { path = "../cd-test-gateway" }
# start_paused deadline races in gateway_diagnostic_contract_audit
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread", "time"] }
