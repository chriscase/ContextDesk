[package]
name = "cd-cli"
description = "ContextDesk CLI — a thin adapter over cd-workflow, the same host-neutral orchestration the desktop app uses"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "contextdesk"
path = "src/main.rs"

[dependencies]
cd-core = { path = "../cd-core" }
cd-workflow = { path = "../cd-workflow" }
clap = { version = "4", features = ["derive", "env"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
semver = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { workspace = true, features = ["signal"] }
dirs = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
zip = "2"
cd-test-gateway = { path = "../cd-test-gateway" }
# Real-pty coverage only (crates/cd-cli/tests/pty_interactive_chat.rs) — the
# in-place-redraw code path is unobservable through assert_cmd's piped,
# non-tty subprocess, since IsTerminal is always false there.
portable-pty = "0.8"
# Deterministic paused-clock coverage for gateway diagnostic budgets.
tokio = { workspace = true, features = ["test-util"] }
