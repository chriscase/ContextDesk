# Gitleaks config for ContextDesk.
# Prefer redacting fixtures over allowlists. See docs/DEV.md § Secret scanning.

title = "ContextDesk"

[extend]
# Use default gitleaks rules; this file documents local policy + optional path allowlists.
useDefault = true

# Documented false positives: synthetic tokens used only to unit-test the
# redaction pipeline (MEMORY.md §5 / #272). Fixtures are built at runtime from
# string fragments; residual matches on marker strings are not live secrets.
[[allowlists]]
description = "Offline redaction unit-test fixtures (not live credentials)"
paths = ['''crates/cd-core/src/redact\.rs''']

# The frozen import-plan contract contains a public, deterministic SHA-256
# capability token. Its field name and entropy intentionally resemble an API
# token, so constrain this false-positive exemption to that exact JSON field,
# fixture path. Other content in the fixture remains scanned.
[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Deterministic import-plan contract token (not a credential)"
  condition = "AND"
  regexTarget = "line"
  regexes = ['''"planToken": "[0-9a-f]{64}",''']
  paths = ['''^fixtures/contracts/import_preview_plan\.v1\.json$''']

  # Retrieval-ablation truth manifests reference events by correlation-style
  # message tokens (`ord-…`, `req-…`, `txn-…`, `inv-…`, `shard-…`, `chk-…`).
  # These are frozen benchmark evidence identifiers, not key material; the
  # `"token"` field name trips the generic rule. Fixtures are byte-frozen by
  # retrieval_ablation_lab.rs, so redacting the sample is not an option.
  [[rules.allowlists]]
  description = "Retrieval-ablation truth-manifest message tokens (correlation ids, not credentials)"
  condition = "AND"
  regexTarget = "line"
  regexes = ['''"token": "[a-z]{2,8}-[0-9A-F]{8}",?''']
  paths = ['''^fixtures/log-lab/scenarios/retrieval-ablation/cases/[a-z0-9-]+/truth/manifest\.json$''']

  # The first published Garage evaluation commits used this literal marker
  # before it was renamed to the lower-entropy REPLACE_THIS_VALUE sentinel.
  # Gitleaks scans the complete first-parent PR range, so the old marker must
  # remain narrowly allowlisted for these four non-secret fixture/doc files;
  # no generated or operator credential is exempted.
  [[rules.allowlists]]
  description = "Historical Garage placeholder marker (not a credential)"
  condition = "AND"
  regexTarget = "line"
  regexes = ['''replace-with-64-hex-characters''']
  paths = [
    '''^collab/deploy/garage-evidence-evaluation/garage\.toml$''',
    '''^collab/scripts/qualify-s3-evidence\.mjs$''',
    '''^collab/server/src/evidence/s3-garage\.integration\.test\.ts$''',
    '''^docs/help/war-room/war-room-s3-evidence-store\.md$''',
  ]

  # rb14-secrets-malformed deliberately contains synthetic auth-service log
  # lines ("token issued subject=svc-<hex8> ttl=…") to exercise secret-aware
  # handling. The subjects are synthetic service ids; nothing authenticates.
  [[rules.allowlists]]
  description = "rb14 synthetic token-service log lines (benchmark fixture, not credentials)"
  condition = "AND"
  regexTarget = "line"
  regexes = ['''token issued subject=svc-[0-9a-f]{8} ttl=\d+''']
  paths = ['''^fixtures/log-lab/scenarios/retrieval-ablation/cases/rb14-secrets-malformed/import/auth/tokens\.jsonl$''']
