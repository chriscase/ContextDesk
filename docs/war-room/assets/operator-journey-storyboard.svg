<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1660" viewBox="0 0 1200 1660" role="img" aria-labelledby="title desc">
  <title id="title">Illustrated ContextDesk War Room operator journey</title>
  <desc id="desc">Seven labeled interface panels show Capture, Import, Freeze, Analyze, Compare, Decide, and Export. The panels are an annotated synthetic storyboard, not runtime screenshots.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16243a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3048"/>
      <stop offset="1" stop-color="#142236"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".24"/>
    </filter>
    <style>
      .title{font:700 29px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fbff}
      .subtitle{font:500 16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#aec0d7}
      .step{font:700 16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8fe3c1;letter-spacing:1.5px}
      .paneltitle{font:700 20px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fbff}
      .body{font:500 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#c8d5e6}
      .muted{font:500 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8ea3bd}
      .chip{font:700 11px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#d8fff0;letter-spacing:.5px}
      .line{stroke:#6f88a6;stroke-width:2;stroke-linecap:round}
      .soft{fill:#263c58}
    </style>
  </defs>
  <rect width="1200" height="1660" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" class="title">War Room · the safe path from evidence to decision</text>
  <text x="70" y="104" class="subtitle">Illustrated synthetic storyboard · use the walkthrough for the real controls and capture checklist</text>
  <path d="M70 132H1130" stroke="#39516f"/>

  <!-- panel 1 -->
  <g transform="translate(70 160)" filter="url(#shadow)">
    <rect width="500" height="300" rx="18" fill="url(#panel)"/>
    <text x="28" y="38" class="step">01 · CAPTURE</text><text x="28" y="70" class="paneltitle">Start with what people actually know</text>
    <rect x="28" y="94" width="444" height="56" rx="10" class="soft"/><text x="45" y="119" class="body">Human note · “worker pool stalled after deploy”</text><text x="45" y="139" class="muted">source: Chris · privacy: share-safe · time anchored</text>
    <rect x="28" y="166" width="210" height="84" rx="10" fill="#193d42" stroke="#49c9a0"/><text x="45" y="193" class="body">shared-timeout.log</text><text x="45" y="216" class="chip">SHARE-SAFE</text><text x="45" y="238" class="muted">original artifact retained</text>
    <rect x="252" y="166" width="220" height="84" rx="10" fill="#3b2f4a" stroke="#d49af2"/><text x="269" y="193" class="body">unique-worker.log</text><text x="269" y="216" class="chip" fill="#f2d8ff">OWNER-ONLY</text><text x="269" y="238" class="muted">not eligible for sharing</text>
  </g>
  <!-- panel 2 -->
  <g transform="translate(630 160)" filter="url(#shadow)">
    <rect width="500" height="300" rx="18" fill="url(#panel)"/>
    <text x="28" y="38" class="step">02 · IMPORT</text><text x="28" y="70" class="paneltitle">Keep outside AI output honest</text>
    <rect x="28" y="94" width="444" height="112" rx="10" class="soft"/><text x="45" y="122" class="body">Fixture chat assistant</text><text x="45" y="144" class="muted">“The timeout is probably caused by…”</text><text x="45" y="166" class="muted">source kind: external-tool · corroboration: none</text>
    <rect x="45" y="178" width="118" height="22" rx="11" fill="#5c3d23"/><text x="60" y="194" class="chip" fill="#ffd9a3">UNVERIFIED</text>
    <path d="M28 232H472" class="line" opacity=".45"/><text x="28" y="258" class="body">Never turn a pasted answer into a human note.</text>
  </g>
  <!-- panel 3 -->
  <g transform="translate(70 500)" filter="url(#shadow)">
    <rect width="500" height="300" rx="18" fill="url(#panel)"/>
    <text x="28" y="38" class="step">03 · FREEZE</text><text x="28" y="70" class="paneltitle">Make the comparison boundary explicit</text>
    <rect x="28" y="94" width="444" height="58" rx="10" fill="#193d42"/><text x="45" y="121" class="body">snapshot-1 · host-frozen</text><text x="45" y="141" class="muted">privacy: share-safe · lineage: root</text>
    <text x="28" y="184" class="muted">fingerprint</text><text x="28" y="208" class="body">8b0d…4a91</text><rect x="180" y="187" width="108" height="22" rx="11" fill="#1d5a53"/><text x="196" y="203" class="chip">SAME SNAPSHOT</text>
    <path d="M28 238H472" class="line" opacity=".45"/><text x="28" y="264" class="body">Only selected evidence enters this frozen view.</text>
  </g>
  <!-- panel 4 -->
  <g transform="translate(630 500)" filter="url(#shadow)">
    <rect width="500" height="300" rx="18" fill="url(#panel)"/>
    <text x="28" y="38" class="step">04 · ANALYZE</text><text x="28" y="70" class="paneltitle">Bind each lane to the snapshot</text>
    <g transform="translate(28 96)"><rect width="444" height="42" rx="9" class="soft"/><circle cx="20" cy="21" r="7" fill="#8fe3c1"/><text x="38" y="26" class="body">Investigator · qwen-3.6-27b</text><text x="340" y="26" class="chip">BOUND</text></g>
    <g transform="translate(28 148)"><rect width="444" height="42" rx="9" class="soft"/><circle cx="20" cy="21" r="7" fill="#8fe3c1"/><text x="38" y="26" class="body">Reviewer · gpt-oss-120b</text><text x="340" y="26" class="chip">BOUND</text></g>
    <g transform="translate(28 200)"><rect width="444" height="42" rx="9" class="soft"/><circle cx="20" cy="21" r="7" fill="#8fe3c1"/><text x="38" y="26" class="body">Skeptic · ministral-3-14b</text><text x="340" y="26" class="chip">BOUND</text></g>
  </g>
  <!-- panel 5 -->
  <g transform="translate(70 840)" filter="url(#shadow)">
    <rect width="500" height="300" rx="18" fill="url(#panel)"/>
    <text x="28" y="38" class="step">05 · COMPARE</text><text x="28" y="70" class="paneltitle">Make agreement useful, never magical</text>
    <rect x="28" y="96" width="136" height="80" rx="10" fill="#193d42"/><text x="45" y="124" class="chip">AGREEMENT</text><text x="45" y="151" class="body">2 shared claims</text>
    <rect x="182" y="96" width="136" height="80" rx="10" fill="#493b23"/><text x="199" y="124" class="chip">DIFFERENCES</text><text x="199" y="151" class="body">1 claim split</text>
    <rect x="336" y="96" width="136" height="80" rx="10" fill="#3b2f4a"/><text x="353" y="124" class="chip">UNKNOWN</text><text x="353" y="151" class="body">2 uncited</text>
    <rect x="28" y="202" width="444" height="52" rx="10" fill="#5c3d23"/><text x="45" y="233" class="body">Agreement is not proof of correctness.</text>
  </g>
  <!-- panel 6 -->
  <g transform="translate(630 840)" filter="url(#shadow)">
    <rect width="500" height="300" rx="18" fill="url(#panel)"/>
    <text x="28" y="38" class="step">06 · DECIDE</text><text x="28" y="70" class="paneltitle">Let a person own the decision</text>
    <rect x="28" y="96" width="444" height="54" rx="10" class="soft"/><text x="45" y="128" class="body">Proposed · inspect worker-pool timeout path</text>
    <rect x="28" y="166" width="444" height="54" rx="10" fill="#193d42" stroke="#49c9a0"/><text x="45" y="198" class="body">Accepted · revision 2 · actor: Chris</text>
    <text x="28" y="255" class="muted">References: snapshot-1 · 3 evidence items</text>
  </g>
  <!-- panel 7 -->
  <g transform="translate(70 1180)" filter="url(#shadow)">
    <rect width="1060" height="300" rx="18" fill="url(#panel)"/>
    <text x="28" y="38" class="step">07 · EXPORT</text><text x="28" y="70" class="paneltitle">Share the decision without leaking the investigation</text>
    <rect x="28" y="96" width="300" height="132" rx="10" fill="#193d42"/><text x="48" y="126" class="chip">SHARE-SAFE REVIEW</text><text x="48" y="158" class="body">accepted decision</text><text x="48" y="184" class="body">snapshot proof · root</text><text x="48" y="210" class="body">omissions: owner-only bytes</text>
    <rect x="356" y="96" width="676" height="132" rx="10" class="soft"/><text x="378" y="126" class="muted">redacted preview</text><text x="378" y="158" class="body">Decision: inspect worker-pool timeout path</text><text x="378" y="184" class="body">Evidence: 3 share-safe references</text><text x="378" y="210" class="muted">fingerprint and private free text withheld</text>
    <text x="28" y="264" class="body">The reviewer can verify lineage and privacy without receiving owner-only artifacts.</text>
  </g>
  <text x="70" y="1570" class="subtitle">Synthetic storyboard · replace or supplement with sanitized runtime captures from the acceptance checklist</text>
</svg>
