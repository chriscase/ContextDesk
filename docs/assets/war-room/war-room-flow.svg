<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="war-room-flow-title war-room-flow-desc">
  <title id="war-room-flow-title">War Room evidence-first workflow</title>
  <desc id="war-room-flow-desc">A dark-neutral and gold diagram showing five stages: Situation defines the problem, Capture preserves recognizable evidence, Analyze records human and model lane attempts, Compare separates agreement, disagreement, and unknowns, and Decide assigns a next action and owner before a human decision and export. An evidence rail remains visible through every stage.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11110f"/>
      <stop offset="0.52" stop-color="#1b1a17"/>
      <stop offset="1" stop-color="#121211"/>
    </linearGradient>
    <linearGradient id="gold-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d7335"/>
      <stop offset="0.5" stop-color="#e1c36f"/>
      <stop offset="1" stop-color="#8d7335"/>
    </linearGradient>
    <linearGradient id="decision-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a311d"/>
      <stop offset="1" stop-color="#241f16"/>
    </linearGradient>
    <filter id="soft-shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <filter id="gold-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#d6b55e"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2.6px; text-transform: uppercase; }
      .stage-number { font-size: 13px; font-weight: 750; letter-spacing: 1.8px; }
      .stage-title { font-size: 25px; font-weight: 720; letter-spacing: -0.3px; }
      .body { font-size: 15px; font-weight: 450; }
      .small { font-size: 13px; font-weight: 550; }
      .rail-title { font-size: 17px; font-weight: 700; }
      .rail-label { font-size: 14px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1440" height="820" rx="28" fill="url(#background)"/>
  <path d="M0 168 C330 126 570 215 891 152 C1118 108 1284 119 1440 91 L1440 0 L0 0 Z" fill="#d8b65c" opacity="0.035"/>
  <circle cx="1306" cy="96" r="188" fill="none" stroke="#d8b65c" stroke-width="1" opacity="0.08"/>
  <circle cx="1306" cy="96" r="140" fill="none" stroke="#d8b65c" stroke-width="1" opacity="0.08"/>

  <g class="sans">
    <text x="72" y="68" class="eyebrow" fill="#d9b85f">ContextDesk · War Room</text>
    <text x="72" y="117" font-size="38" font-weight="760" letter-spacing="-0.9" fill="#f6f0e2">Evidence stays attached to the decision</text>
    <text x="72" y="151" class="body" fill="#aaa69c">Five stages turn a bounded problem into a human-owned, reviewable next action.</text>

    <!-- Workflow connector -->
    <path d="M292 340 H319 M560 340 H587 M828 340 H855 M1096 340 H1123" fill="none" stroke="url(#gold-line)" stroke-width="3" marker-end="url(#arrow)" opacity="0.95"/>

    <!-- Situation -->
    <g filter="url(#soft-shadow)">
      <rect x="52" y="216" width="240" height="248" rx="18" fill="#22211e" stroke="#4a463b"/>
      <rect x="52" y="216" width="240" height="5" rx="2.5" fill="#867039"/>
    </g>
    <circle cx="82" cy="256" r="14" fill="#d9b85f" opacity="0.15"/>
    <text x="82" y="261" text-anchor="middle" class="stage-number" fill="#e2c36e">01</text>
    <text x="76" y="306" class="stage-title" fill="#f6f0e2">Situation</text>
    <text x="76" y="340" class="body" fill="#c0bcb2">
      <tspan x="76" dy="0">Define the observed</tspan>
      <tspan x="76" dy="23">problem, impact, scope,</tspan>
      <tspan x="76" dy="23">and honest unknowns.</tspan>
    </text>
    <rect x="76" y="419" width="110" height="25" rx="12.5" fill="#302d26"/>
    <text x="131" y="436" text-anchor="middle" class="small" fill="#d8d1c2">Bound the problem</text>

    <!-- Capture -->
    <g filter="url(#soft-shadow)">
      <rect x="320" y="216" width="240" height="248" rx="18" fill="#22211e" stroke="#4a463b"/>
      <rect x="320" y="216" width="240" height="5" rx="2.5" fill="#9c8241"/>
    </g>
    <circle cx="350" cy="256" r="14" fill="#d9b85f" opacity="0.15"/>
    <text x="350" y="261" text-anchor="middle" class="stage-number" fill="#e2c36e">02</text>
    <text x="344" y="306" class="stage-title" fill="#f6f0e2">Capture</text>
    <text x="344" y="340" class="body" fill="#c0bcb2">
      <tspan x="344" dy="0">Preserve recognizable</tspan>
      <tspan x="344" dy="23">logs, stack traces, notes,</tspan>
      <tspan x="344" dy="23">context, and provenance.</tspan>
    </text>
    <rect x="344" y="419" width="119" height="25" rx="12.5" fill="#302d26"/>
    <text x="403.5" y="436" text-anchor="middle" class="small" fill="#d8d1c2">Inspect the source</text>

    <!-- Analyze -->
    <g filter="url(#soft-shadow)">
      <rect x="588" y="216" width="240" height="248" rx="18" fill="#22211e" stroke="#4a463b"/>
      <rect x="588" y="216" width="240" height="5" rx="2.5" fill="#b3944b"/>
    </g>
    <circle cx="618" cy="256" r="14" fill="#d9b85f" opacity="0.15"/>
    <text x="618" y="261" text-anchor="middle" class="stage-number" fill="#e2c36e">03</text>
    <text x="612" y="306" class="stage-title" fill="#f6f0e2">Analyze</text>
    <text x="612" y="340" class="body" fill="#c0bcb2">
      <tspan x="612" dy="0">Record independent human</tspan>
      <tspan x="612" dy="23">and model attempts with</tspan>
      <tspan x="612" dy="23">findings and lane history.</tspan>
    </text>
    <rect x="612" y="419" width="116" height="25" rx="12.5" fill="#302d26"/>
    <text x="670" y="436" text-anchor="middle" class="small" fill="#d8d1c2">Cite every finding</text>

    <!-- Compare -->
    <g filter="url(#soft-shadow)">
      <rect x="856" y="216" width="240" height="248" rx="18" fill="#22211e" stroke="#4a463b"/>
      <rect x="856" y="216" width="240" height="5" rx="2.5" fill="#c6a452"/>
    </g>
    <circle cx="886" cy="256" r="14" fill="#d9b85f" opacity="0.15"/>
    <text x="886" y="261" text-anchor="middle" class="stage-number" fill="#e2c36e">04</text>
    <text x="880" y="306" class="stage-title" fill="#f6f0e2">Compare</text>
    <text x="880" y="340" class="body" fill="#c0bcb2">
      <tspan x="880" dy="0">Separate agreement,</tspan>
      <tspan x="880" dy="23">disagreement, unsupported</tspan>
      <tspan x="880" dy="23">claims, and unknowns.</tspan>
    </text>
    <rect x="880" y="419" width="126" height="25" rx="12.5" fill="#302d26"/>
    <text x="943" y="436" text-anchor="middle" class="small" fill="#d8d1c2">No consensus shortcut</text>

    <!-- Decide -->
    <g filter="url(#soft-shadow)">
      <rect x="1124" y="216" width="264" height="248" rx="18" fill="url(#decision-card)" stroke="#b59448" stroke-width="1.5"/>
      <rect x="1124" y="216" width="264" height="5" rx="2.5" fill="#e1c36f" filter="url(#gold-glow)"/>
    </g>
    <circle cx="1154" cy="256" r="14" fill="#e1c36f" opacity="0.18"/>
    <text x="1154" y="261" text-anchor="middle" class="stage-number" fill="#f0d887">05</text>
    <text x="1148" y="306" class="stage-title" fill="#fff7e5">Decide</text>
    <text x="1148" y="340" class="body" fill="#d8d0bf">
      <tspan x="1148" dy="0">Choose the next action,</tspan>
      <tspan x="1148" dy="23">assign its owner, preserve</tspan>
      <tspan x="1148" dy="23">rationale, then export.</tspan>
    </text>
    <rect x="1148" y="419" width="151" height="25" rx="12.5" fill="#4a3e22" stroke="#8d7538"/>
    <text x="1223.5" y="436" text-anchor="middle" class="small" fill="#f0d887">Human approval boundary</text>

    <!-- Evidence rail -->
    <rect x="52" y="518" width="1336" height="224" rx="20" fill="#181815" stroke="#3c3931"/>
    <text x="78" y="556" class="eyebrow" fill="#a98d47">The reviewable chain</text>
    <text x="78" y="586" class="rail-title" fill="#eee7d9">Evidence and provenance remain visible from first observation to final handoff.</text>

    <path d="M122 655 H1285" fill="none" stroke="#504a3b" stroke-width="2"/>
    <path d="M122 655 H1285" fill="none" stroke="url(#gold-line)" stroke-width="2" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.72"/>

    <g>
      <circle cx="122" cy="655" r="14" fill="#181815" stroke="#d7b75e" stroke-width="3"/>
      <circle cx="122" cy="655" r="4" fill="#f1d77f"/>
      <text x="122" y="696" text-anchor="middle" class="rail-label" fill="#e9e1d2">Problem</text>
      <text x="122" y="718" text-anchor="middle" class="small" fill="#8f8b82">bounded</text>
    </g>
    <g>
      <circle cx="348" cy="655" r="14" fill="#181815" stroke="#d7b75e" stroke-width="3"/>
      <circle cx="348" cy="655" r="4" fill="#f1d77f"/>
      <text x="348" y="696" text-anchor="middle" class="rail-label" fill="#e9e1d2">Evidence</text>
      <text x="348" y="718" text-anchor="middle" class="small" fill="#8f8b82">recognizable + sourced</text>
    </g>
    <g>
      <circle cx="588" cy="655" r="14" fill="#181815" stroke="#d7b75e" stroke-width="3"/>
      <circle cx="588" cy="655" r="4" fill="#f1d77f"/>
      <text x="588" y="696" text-anchor="middle" class="rail-label" fill="#e9e1d2">Lane attempts</text>
      <text x="588" y="718" text-anchor="middle" class="small" fill="#8f8b82">human + model</text>
    </g>
    <g>
      <circle cx="840" cy="655" r="14" fill="#181815" stroke="#d7b75e" stroke-width="3"/>
      <circle cx="840" cy="655" r="4" fill="#f1d77f"/>
      <text x="840" y="696" text-anchor="middle" class="rail-label" fill="#e9e1d2">Comparison</text>
      <text x="840" y="718" text-anchor="middle" class="small" fill="#8f8b82">align · diverge · unknown</text>
    </g>
    <g>
      <circle cx="1069" cy="655" r="14" fill="#181815" stroke="#d7b75e" stroke-width="3"/>
      <circle cx="1069" cy="655" r="4" fill="#f1d77f"/>
      <text x="1069" y="696" text-anchor="middle" class="rail-label" fill="#e9e1d2">Action + owner</text>
      <text x="1069" y="718" text-anchor="middle" class="small" fill="#8f8b82">explicit accountability</text>
    </g>
    <g>
      <circle cx="1285" cy="655" r="17" fill="#3f341c" stroke="#e3c56f" stroke-width="3" filter="url(#gold-glow)"/>
      <path d="M1277 655 L1283 661 L1294 648" fill="none" stroke="#f7e7ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1285" y="696" text-anchor="middle" class="rail-label" fill="#f2d982">Human decision</text>
      <text x="1285" y="718" text-anchor="middle" class="small" fill="#b9a979">review + export</text>
    </g>

    <text x="720" y="784" text-anchor="middle" class="small" fill="#77736b">Agreement informs judgment. Evidence supports it. A human owns it.</text>
  </g>
</svg>
