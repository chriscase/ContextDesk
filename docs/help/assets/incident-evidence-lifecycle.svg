<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160" role="img" aria-labelledby="title" aria-label="Producer builds a bundle, offline validation gates transfer, product import remains residual">
  <title id="title">Producer validates and transfers an Incident Evidence Bundle</title>
  <!-- Explicit dual-readable hex palette (dark card). External img/base64 cannot inherit page theme. -->
  <rect width="720" height="160" fill="#0f172a"/>
  <rect x="16" y="40" width="150" height="80" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
  <text x="91" y="75" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#e5e7eb">Producer</text>
  <text x="91" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#9ca3af">logs + metrics</text>
  <path d="M174 80 H220" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="228" y="40" width="150" height="80" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
  <text x="303" y="75" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#e5e7eb">Offline validate</text>
  <text x="303" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#9ca3af">hashes + paths</text>
  <path d="M386 80 H432" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="440" y="40" width="120" height="80" rx="8" fill="#111827" stroke="#34d399" stroke-width="2"/>
  <text x="500" y="85" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#e5e7eb">Transfer</text>
  <path d="M568 80 H614" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="622" y="40" width="82" height="80" rx="8" fill="#1f2937" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="663" y="75" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#e5e7eb">Import</text>
  <text x="663" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#fef3c7">residual</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>
</svg>
