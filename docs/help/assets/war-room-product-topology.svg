<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="war-room-topology-title war-room-topology-desc">
  <title id="war-room-topology-title">War Room product and deployment topology</title>
  <desc id="war-room-topology-desc">Authorized browsers submit actions to the authoritative War Room web and API service, which stores investigation records and evidence. The service can run privately on loopback with SQLite or as a shared PostgreSQL and LDAP-capable deployment. ContextDesk desktop and CLI use explicit handoff, while an optional host-owned bridge connects bounded model lane work to configured models.</desc>
  <defs>
    <marker id="topology-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="700" rx="24" fill="#0f172a"/>
  <text x="40" y="50" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Browser client, authoritative service, explicit handoff</text>
  <text x="40" y="80" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">Local and shared deployments keep the same service boundary.</text>

  <path d="M300 235H415" fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#topology-arrow)"/>
  <path d="M780 235H895" fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#topology-arrow)"/>

  <rect x="40" y="120" width="260" height="230" rx="16" fill="#111827" stroke="#34d399" stroke-width="2"/>
  <text x="170" y="166" text-anchor="middle" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Authorized browser</text>
  <text x="170" y="207" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">Renders bounded views</text>
  <text x="170" y="235" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">Submits signed-in actions</text>
  <text x="170" y="263" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">Keeps no provider secrets</text>
  <rect x="65" y="298" width="210" height="30" rx="15" fill="#064e3b" stroke="#34d399"/>
  <text x="170" y="319" text-anchor="middle" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="13">Authorization still applies</text>

  <rect x="420" y="120" width="360" height="230" rx="16" fill="#111827" stroke="#38bdf8" stroke-width="3"/>
  <text x="600" y="166" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="22" font-weight="700">War Room web + API service</text>
  <text x="600" y="207" text-anchor="middle" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="15">Identity and permissions</text>
  <text x="600" y="235" text-anchor="middle" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="15">Provenance and accepted state</text>
  <text x="600" y="263" text-anchor="middle" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="15">Snapshots, lanes, audit, exports</text>
  <rect x="492" y="298" width="216" height="30" rx="15" fill="#082f49" stroke="#38bdf8"/>
  <text x="600" y="319" text-anchor="middle" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="13">Server-authoritative record</text>

  <rect x="900" y="120" width="260" height="230" rx="16" fill="#111827" stroke="#fbbf24" stroke-width="2"/>
  <text x="1030" y="166" text-anchor="middle" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Durable storage</text>
  <text x="1030" y="207" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">Investigation records</text>
  <text x="1030" y="235" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">Filesystem evidence bytes</text>
  <text x="1030" y="263" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">Deployment-owned backup</text>
  <rect x="945" y="298" width="170" height="30" rx="15" fill="#422006" stroke="#fbbf24"/>
  <text x="1030" y="319" text-anchor="middle" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="13">No silent remote fetch</text>

  <rect x="40" y="385" width="1120" height="88" rx="16" fill="#111827" stroke="#475569" stroke-width="2"/>
  <text x="280" y="422" text-anchor="middle" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Private local</text>
  <text x="280" y="450" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Loopback · SQLite · local auth · single node</text>
  <text x="855" y="422" text-anchor="middle" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Shared deployment</text>
  <text x="855" y="450" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">PostgreSQL · encrypted LDAP-capable sign-in · operator-managed ingress</text>

  <path d="M150 642V672H630V645" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#topology-arrow)"/>
  <path d="M390 642V660H630V645" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#topology-arrow)"/>
  <path d="M630 520V355" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#topology-arrow)"/>
  <path d="M720 350V498H870V515" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#topology-arrow)"/>
  <path d="M960 580H995" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#topology-arrow)"/>

  <rect x="40" y="520" width="220" height="122" rx="14" fill="#111827" stroke="#34d399" stroke-width="2"/>
  <text x="150" y="560" text-anchor="middle" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="18" font-weight="700">ContextDesk desktop</text>
  <text x="150" y="594" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Local exploration</text>
  <text x="150" y="619" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">and evidence review</text>

  <rect x="300" y="520" width="180" height="122" rx="14" fill="#111827" stroke="#34d399" stroke-width="2"/>
  <text x="390" y="560" text-anchor="middle" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="18" font-weight="700">ContextDesk CLI</text>
  <text x="390" y="594" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Normalize, inspect,</text>
  <text x="390" y="619" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">validate, automate</text>

  <rect x="520" y="520" width="220" height="122" rx="14" fill="#111827" stroke="#fbbf24" stroke-width="2"/>
  <text x="630" y="560" text-anchor="middle" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Explicit handoff</text>
  <text x="630" y="594" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Selected material</text>
  <text x="630" y="619" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">or reviewed package</text>

  <rect x="780" y="520" width="180" height="122" rx="14" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
  <text x="870" y="560" text-anchor="middle" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Host bridge</text>
  <text x="870" y="594" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Optional bounded</text>
  <text x="870" y="619" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">lane execution</text>

  <rect x="1000" y="520" width="160" height="122" rx="14" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
  <text x="1080" y="557" text-anchor="middle" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Configured models</text>
  <text x="1080" y="587" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Credentials</text>
  <text x="1080" y="607" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">and endpoints</text>
  <text x="1080" y="627" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">stay host-side</text>
</svg>
