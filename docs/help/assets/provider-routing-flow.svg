<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">AI provider routing and credential boundary</title>
  <desc id="desc">The selected session model sends a hard-bounded turn through the trusted host to one of four provider paths while secrets remain host-side.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#38bdf8"/></marker></defs>
  <rect x="20" y="24" width="860" height="292" rx="18" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="50" y="112" width="180" height="104" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="140" y="148" fill="#e5e7eb" font-size="17" font-weight="700">Session model</text>
    <text x="140" y="176" fill="#9ca3af" font-size="13">history + selected evidence</text>
    <text x="140" y="197" fill="#9ca3af" font-size="13">hard context fit</text>
    <path d="M236 164H309" stroke="#38bdf8" stroke-width="4" marker-end="url(#a)"/>
    <rect x="320" y="82" width="230" height="164" rx="14" fill="#082f49" stroke="#38bdf8" stroke-width="3"/>
    <text x="435" y="118" fill="#e5e7eb" font-size="18" font-weight="700">Trusted Rust host</text>
    <text x="435" y="151" fill="#9ca3af" font-size="14">endpoint and SSRF policy</text>
    <text x="435" y="177" fill="#9ca3af" font-size="14">keychain / opted-in session</text>
    <text x="435" y="203" fill="#9ca3af" font-size="14">tool capability detection</text>
    <path d="M556 164H609" stroke="#38bdf8" stroke-width="4" marker-end="url(#a)"/>
    <rect x="620" y="60" width="230" height="208" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="735" y="94" fill="#e5e7eb" font-size="18" font-weight="700">One configured path</text>
    <text x="735" y="128" fill="#e5e7eb" font-size="14">Ollama (local)</text>
    <text x="735" y="158" fill="#e5e7eb" font-size="14">Grok Build session</text>
    <text x="735" y="188" fill="#e5e7eb" font-size="14">OpenAI-compatible</text>
    <text x="735" y="218" fill="#e5e7eb" font-size="14">Anthropic Messages</text>
    <text x="735" y="246" fill="#9ca3af" font-size="12">Remote paths receive selected context</text>
  </g>
</svg>
