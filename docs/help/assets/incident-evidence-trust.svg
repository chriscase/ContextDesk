<svg xmlns="http://www.w3.org/2000/svg" width="680" height="180" viewBox="0 0 680 180" role="img" aria-labelledby="title" aria-label="Trust boundary between producer, offline validator, and product publication">
  <title id="title">Trust boundary for offline validation</title>
  <rect width="680" height="180" fill="none"/>
  <rect x="20" y="30" width="180" height="120" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="110" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="currentColor">Producer host</text>
  <text x="110" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="currentColor">authorized files only</text>
  <text x="110" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="currentColor">no network in validate</text>
  <rect x="250" y="30" width="180" height="120" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="340" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="currentColor">Offline validator</text>
  <text x="340" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="currentColor">paths · hashes · limits</text>
  <text x="340" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="currentColor">fail closed</text>
  <rect x="480" y="30" width="180" height="120" rx="8" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="570" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="currentColor">Product publish</text>
  <text x="570" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="currentColor">import residual</text>
  <text x="570" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="currentColor">no partial state</text>
  <path d="M200 90 H250" stroke="currentColor" stroke-width="2" fill="none"/>
  <path d="M430 90 H480" stroke="currentColor" stroke-width="2" fill="none" stroke-dasharray="4 3"/>
</svg>
