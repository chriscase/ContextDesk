<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
  <title id="title">Connector registration and policy flow</title>
  <desc id="desc">Non-secret connector configuration and keychain references attach tools to the host, where endpoint, read-only, and permission policy precede evidence or writes.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#38bdf8"/></marker></defs>
  <rect x="20" y="26" width="860" height="298" rx="18" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="48" y="78" width="190" height="92" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="143" y="112" fill="#e5e7eb" font-size="16" font-weight="700">Connector config</text>
    <text x="143" y="140" fill="#9ca3af" font-size="13">paths, hosts, allowlists</text>
    <rect x="48" y="202" width="190" height="72" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="143" y="232" fill="#e5e7eb" font-size="16" font-weight="700">OS keychain</text>
    <text x="143" y="256" fill="#9ca3af" font-size="13">secret values only</text>
    <path d="M244 124H323" stroke="#38bdf8" stroke-width="4" marker-end="url(#a)"/>
    <path d="M244 238H292Q316 238 323 214" fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#a)"/>
    <rect x="334" y="72" width="238" height="208" rx="14" fill="#082f49" stroke="#38bdf8" stroke-width="3"/>
    <text x="453" y="108" fill="#e5e7eb" font-size="18" font-weight="700">Host policy</text>
    <text x="453" y="143" fill="#9ca3af" font-size="14">attach + discover tools</text>
    <text x="453" y="171" fill="#9ca3af" font-size="14">SSRF / path / SQL checks</text>
    <text x="453" y="199" fill="#9ca3af" font-size="14">Read / SoftWrite / HardWrite</text>
    <text x="453" y="227" fill="#9ca3af" font-size="14">timeouts + response caps</text>
    <path d="M578 176H637" stroke="#38bdf8" stroke-width="4" marker-end="url(#a)"/>
    <rect x="648" y="86" width="204" height="76" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <text x="750" y="118" fill="#e5e7eb" font-size="16" font-weight="700">Read evidence</text>
    <text x="750" y="142" fill="#e5e7eb" font-size="13">bounded + cited</text>
    <rect x="648" y="194" width="204" height="76" rx="12" fill="#451a03" stroke="#fbbf24" stroke-width="2"/>
    <text x="750" y="226" fill="#e5e7eb" font-size="16" font-weight="700">Proposed change</text>
    <text x="750" y="250" fill="#fde68a" font-size="13">waits for confirmation</text>
  </g>
</svg>
