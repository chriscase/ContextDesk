<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="context-answer-title context-answer-desc">
  <title id="context-answer-title">How ContextDesk builds a grounded answer</title>
  <desc id="context-answer-desc">The trusted host binds the turn, prepares bounded direct context, filters eligible tools, validates and caps retrieval, and fits the model budget. The model chooses among offered tools and synthesizes returned evidence. Search trails, citations, errors, and permission states remain visible.</desc>
  <defs>
    <marker id="context-answer-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#38bdf8"/>
    </marker>
    <marker id="context-answer-green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#34d399"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="1160" height="520" rx="22" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
    <text x="54" y="61" fill="#38bdf8" font-size="19" font-weight="700">TRUSTED HOST · DETERMINISTIC CONTROLS</text>
    <text x="54" y="354" fill="#34d399" font-size="19" font-weight="700">SELECTED MODEL · TOOL CHOICE AND SYNTHESIS</text>

    <rect x="48" y="88" width="160" height="174" rx="15" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <text x="128" y="122" text-anchor="middle" fill="#e5e7eb" font-size="17" font-weight="700">1 · Bind turn</text>
    <text x="128" y="156" text-anchor="middle" fill="#9ca3af" font-size="13">Chat + message</text>
    <text x="128" y="181" text-anchor="middle" fill="#9ca3af" font-size="13">Provider + model</text>
    <text x="128" y="206" text-anchor="middle" fill="#9ca3af" font-size="13">Linked snapshot</text>
    <text x="128" y="231" text-anchor="middle" fill="#fbbf24" font-size="12">One immutable turn</text>

    <path d="M212 175H238" stroke="#38bdf8" stroke-width="4" marker-end="url(#context-answer-arrow)"/>

    <rect x="248" y="88" width="180" height="174" rx="15" fill="#111827" stroke="#475569" stroke-width="2"/>
    <text x="338" y="122" text-anchor="middle" fill="#e5e7eb" font-size="17" font-weight="700">2 · Direct inputs</text>
    <text x="338" y="156" text-anchor="middle" fill="#9ca3af" font-size="13">Recent history</text>
    <text x="338" y="181" text-anchor="middle" fill="#9ca3af" font-size="13">Compacted history</text>
    <text x="338" y="206" text-anchor="middle" fill="#9ca3af" font-size="13">Skill + session pack</text>
    <text x="338" y="231" text-anchor="middle" fill="#9ca3af" font-size="13">Bounded memory</text>

    <path d="M432 175H458" stroke="#38bdf8" stroke-width="4" marker-end="url(#context-answer-arrow)"/>

    <rect x="468" y="88" width="180" height="174" rx="15" fill="#111827" stroke="#475569" stroke-width="2"/>
    <text x="558" y="122" text-anchor="middle" fill="#e5e7eb" font-size="17" font-weight="700">3 · Offer tools</text>
    <text x="558" y="156" text-anchor="middle" fill="#9ca3af" font-size="13">Chat type</text>
    <text x="558" y="181" text-anchor="middle" fill="#9ca3af" font-size="13">Capabilities</text>
    <text x="558" y="206" text-anchor="middle" fill="#9ca3af" font-size="13">Allowlists</text>
    <text x="558" y="231" text-anchor="middle" fill="#fbbf24" font-size="12">Permissions unchanged</text>

    <path d="M652 175H678" stroke="#38bdf8" stroke-width="4" marker-end="url(#context-answer-arrow)"/>

    <rect x="688" y="88" width="180" height="174" rx="15" fill="#111827" stroke="#475569" stroke-width="2"/>
    <text x="778" y="122" text-anchor="middle" fill="#e5e7eb" font-size="17" font-weight="700">4 · Retrieve</text>
    <text x="778" y="156" text-anchor="middle" fill="#9ca3af" font-size="13">Validate request</text>
    <text x="778" y="181" text-anchor="middle" fill="#9ca3af" font-size="13">Rank matches</text>
    <text x="778" y="206" text-anchor="middle" fill="#9ca3af" font-size="13">Cap rows + bytes</text>
    <text x="778" y="231" text-anchor="middle" fill="#9ca3af" font-size="13">Record provenance</text>

    <path d="M872 175H898" stroke="#38bdf8" stroke-width="4" marker-end="url(#context-answer-arrow)"/>

    <rect x="908" y="88" width="244" height="174" rx="15" fill="#082f49" stroke="#38bdf8" stroke-width="3"/>
    <text x="1030" y="122" text-anchor="middle" fill="#e5e7eb" font-size="17" font-weight="700">5 · Fit model turn</text>
    <text x="1030" y="156" text-anchor="middle" fill="#dbeafe" font-size="13">System policy + prompt</text>
    <text x="1030" y="181" text-anchor="middle" fill="#dbeafe" font-size="13">Bounded history + evidence</text>
    <text x="1030" y="206" text-anchor="middle" fill="#dbeafe" font-size="13">Context + time deadlines</text>
    <text x="1030" y="231" text-anchor="middle" fill="#fbbf24" font-size="12">Stop visibly if it cannot fit</text>

    <path d="M558 266V385H718" fill="none" stroke="#34d399" stroke-width="4" marker-end="url(#context-answer-green-arrow)"/>
    <rect x="728" y="382" width="190" height="110" rx="15" fill="#064e3b" stroke="#34d399" stroke-width="3"/>
    <text x="823" y="417" text-anchor="middle" fill="#e5e7eb" font-size="17" font-weight="700">Choose tool</text>
    <text x="823" y="446" text-anchor="middle" fill="#d1fae5" font-size="13">Form bounded arguments</text>
    <text x="823" y="470" text-anchor="middle" fill="#d1fae5" font-size="13">or answer without a tool</text>

    <path d="M922 437H950" stroke="#34d399" stroke-width="4" marker-end="url(#context-answer-green-arrow)"/>
    <rect x="960" y="382" width="192" height="110" rx="15" fill="#064e3b" stroke="#34d399" stroke-width="3"/>
    <text x="1056" y="417" text-anchor="middle" fill="#e5e7eb" font-size="17" font-weight="700">Synthesize</text>
    <text x="1056" y="446" text-anchor="middle" fill="#d1fae5" font-size="13">Observation vs inference</text>
    <text x="1056" y="470" text-anchor="middle" fill="#d1fae5" font-size="13">No permission authority</text>

    <path d="M1030 266V352" stroke="#38bdf8" stroke-width="4" marker-end="url(#context-answer-arrow)"/>
    <rect x="48" y="395" width="568" height="96" rx="15" fill="#111827" stroke="#fbbf24" stroke-width="2"/>
    <text x="72" y="427" fill="#fbbf24" font-size="16" font-weight="700">VISIBLE EVIDENCE AND FAILURE STATE</text>
    <text x="72" y="456" fill="#e5e7eb" font-size="13">Tool rows · search trail · citations · caps · permission requests</text>
    <text x="72" y="480" fill="#e5e7eb" font-size="13">Rejected, partial, cancelled, and timed-out work stays explicit.</text>
  </g>
</svg>
